<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aerovaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1426" />
      <stop offset="50%" stop-color="#111f38" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e096" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#aerovaGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Aerova Wings & Jet Icon -->
  <g transform="translate(10, 12)">
    <!-- Back wing trail -->
    <path d="M4 26 C12 24, 22 18, 38 4 C28 14, 18 24, 6 28 Z" fill="url(#wingGrad)" opacity="0.85" />
    <!-- Main supersonic wing -->
    <path d="M2 30 C14 26, 26 16, 42 2 C32 18, 16 32, 2 34 Z" fill="url(#goldGrad)" />
    <!-- Fuselage core -->
    <circle cx="41" cy="3" r="2.5" fill="#ffffff" />
    <!-- Jet trail accent -->
    <path d="M12 33 L24 33" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M16 37 L28 37" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
